<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <!-- Accent line gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)"/>
  <rect width="1200" height="200" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Bottom accent line -->
  <rect x="0" y="196" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- ============================== -->
  <!-- LEFT: Logo (x=50..230, centered ~140) -->
  <!-- ============================== -->
  <text x="140" y="92" font-family="'Arial Black', Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff">
    DIE<tspan fill="#e63946">1</tspan>.EU
  </text>
  <text x="140" y="128" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="5">
    NACHRICHTEN
  </text>

  <!-- Center vertical divider -->
  <line x1="310" y1="55" x2="310" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ============================== -->
  <!-- CENTER: Headline (x=350..730) -->
  <!-- ============================== -->
  <text x="350" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#e63946" letter-spacing="5" font-weight="600">
    AKTUELL
  </text>
  <text x="350" y="116" font-family="'Georgia', 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#ffffff">
    Deutschland im Sparmodus
  </text>
  <text x="350" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)">
    Wirtschaft · Politik · Gesellschaft
  </text>

  <!-- ============================== -->
  <!-- RIGHT: CTA button (x=760..1150) -->
  <!-- ============================== -->
  <rect x="760" y="52" width="390" height="98" rx="10" fill="rgba(230,57,70,0.08)" stroke="#e63946" stroke-width="1.5"/>
  <text x="955" y="92" font-family="'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">
    DIE1.EU
  </text>
  <text x="955" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="2">
    Jetzt weiterlesen →
  </text>

  <!-- Subtle decorative circle (bottom right, very faint) -->
  <circle cx="1130" cy="175" r="30" fill="rgba(255,255,255,0.02)"/>
</svg>
